# vecthere's Kotlin Multiplatform front end: its own Cargo workspace, separate from the engine
# workspace at the repository root. The FFI crate needs `unsafe`, which the engine workspace forbids
# (never-crash rules), so it lives here and nowhere else.
#
# `members` is empty until step 2 of README.md adds `ffi` (crate `vecthere-ffi`, library `vecthere_ffi`).
[workspace]
resolver = "3"
members = []

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind" # the FFI layer catches panics at the boundary

# Mirrors the patch in the repository root Cargo.toml; keep in step when the root changes.
